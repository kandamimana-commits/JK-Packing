<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%A6</text></svg>">
<title>JK888 Packing — Report</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#FBF2E2; --surface:#FFFFFF; --surface-kraft:#F3E4C8;
    --ink:#4A3826; --ink-soft:#93805F; --ink-faint:#C9B594;
    --border:rgba(74,56,38,0.15);
    --tape:#FF7A55; --tape-deep:#E2573A; --tape-soft:#FFE3D3; --on-tape:#FFFFFF;
    --stamp:#5FA980; --stamp-soft:#DCEEE2; --stamp-deep:#3F7D5C;
    --radius-lg:22px; --radius-md:16px; --radius-pill:999px;
    --font-display:'Mitr',sans-serif; --font-body:'Sarabun',sans-serif; --font-mono:'JetBrains Mono',monospace;
    --text-danger:var(--tape-deep); --text-muted:var(--ink-faint);
    --bg-success:var(--stamp-soft); --border-success:var(--stamp); --text-success:var(--stamp-deep);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#241C13; --surface:#332619; --surface-kraft:#3E2F1E;
      --ink:#F6EBDB; --ink-soft:#CBB693; --ink-faint:#8D7856;
      --border:rgba(246,235,219,0.14);
      --tape:#FF8F6E; --tape-deep:#FFA484; --tape-soft:#4A3323; --on-tape:#2A1C10;
      --stamp:#7FC29E; --stamp-soft:#25392E; --stamp-deep:#9FDABB;
    }
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; -webkit-font-smoothing:antialiased; }
  .disp{font-family:var(--font-display);}
  .mono{font-family:var(--font-mono);}
  input,select{ height:50px; border-radius:var(--radius-md); border:1.5px solid var(--border); background:var(--surface); color:var(--ink); padding:0 16px; font-size:16px; font-family:inherit; width:100%; }
  input::placeholder{color:var(--ink-faint);}
  input:focus,select:focus{outline:2px solid var(--tape); outline-offset:1px;}
  button{font-family:inherit; cursor:pointer;}
  label{font-size:14.5px; font-weight:600; color:var(--ink-soft); display:block; margin:0 0 7px;}

  .shell{display:flex; min-height:100vh;}
  .sidebar{width:220px; flex-shrink:0; background:var(--surface-kraft); padding:24px 16px; border-right:1.5px solid var(--border);}
  @media (max-width:768px){ .shell{flex-direction:column;} .sidebar{width:100%; display:flex; align-items:center; gap:14px; padding:14px 18px; border-right:none; border-bottom:1.5px solid var(--border);} .sidebar .navlist{display:flex; flex-direction:row; gap:6px; overflow-x:auto;} .sidebar .navlabel{white-space:nowrap;} }

  .brand{display:flex; align-items:center; gap:10px; margin-bottom:24px; text-decoration:none; color:inherit; position:relative;}
  @media (max-width:768px){ .brand{margin-bottom:0;} }
  .brand-tape{position:absolute; top:-16px; left:-6px; width:52px; height:22px; background:var(--tape); transform:rotate(-8deg); opacity:0.9; border-radius:2px;}
  @media (max-width:768px){ .brand-tape{display:none;} }
  .brand-icon{font-size:26px; line-height:1; position:relative; z-index:1;}
  .brand-name{font-family:var(--font-display); font-size:15.5px; font-weight:700; margin:0; line-height:1.3; position:relative; z-index:1;}

  .navlist{display:flex; flex-direction:column; gap:5px;}
  .navitem{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--radius-md); text-decoration:none; color:var(--ink-soft); font-family:var(--font-display); font-size:15px; font-weight:500; white-space:nowrap;}
  .navitem .navicon{font-size:18px;}
  .navitem.active{background:var(--tape); color:var(--on-tape);}

  .main{flex:1; padding:28px 30px; min-width:0;}
  @media (max-width:768px){ .main{padding:18px;} }
  .pagetitle{font-family:var(--font-display); font-size:26px; font-weight:700; margin:0 0 4px;}
  .pagesub{font-size:15px; color:var(--ink-soft); margin:0 0 24px;}

  .card{background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:22px; margin-bottom:18px;}
  .section-label{font-family:var(--font-display); font-size:18px; font-weight:600; margin:0 0 14px; display:flex; align-items:center; gap:8px;}
  .hint{font-size:14px; color:var(--ink-soft); margin:0 0 12px; line-height:1.5;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:640px){ .row2, .row3{grid-template-columns:1fr;} }

  .file-btn{background:var(--surface-kraft); border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:0 16px; font-size:15px; font-weight:500; color:var(--ink-soft); display:flex; align-items:center; gap:8px; cursor:pointer; justify-content:center; height:50px;}
  input[type=file]{display:none;}
  .suggest-wrap{position:relative;}
  .suggest-panel{position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-md); box-shadow:0 10px 28px rgba(74,56,38,0.16); max-height:240px; overflow-y:auto; z-index:50;}
  .suggest-item{padding:12px 16px; font-size:15.5px; cursor:pointer;}
  .suggest-item:hover, .suggest-item.hl{background:var(--tape-soft); color:var(--tape-deep);}

  .btn-main{background:var(--tape); color:var(--on-tape); border:none; border-radius:var(--radius-pill); height:52px; padding:0 26px; font-family:var(--font-display); font-size:16px; font-weight:600; width:auto; box-shadow:0 4px 14px rgba(226,87,58,0.28);}
  .btn-main:active{transform:translateY(1px);}
  .btn-dark{background:var(--ink); color:var(--surface); border:none; border-radius:var(--radius-pill); height:52px; padding:0 26px; font-family:var(--font-display); font-size:16px; font-weight:600; width:auto;}
  .btn-ghost{border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:var(--radius-pill); height:44px; padding:0 18px; font-size:14.5px; font-weight:500; width:auto;}

  table{width:100%; border-collapse:collapse; font-size:15px;}
  th{text-align:left; padding:10px; color:var(--ink-soft); font-weight:600; border-bottom:1.5px solid var(--border); white-space:nowrap; font-size:13.5px;}
  td{padding:10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  td input{height:42px; font-size:14.5px;}
  .empty{text-align:center; padding:32px 20px; color:var(--ink-faint); font-size:15px;}
  .toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:12px; margin-bottom:18px;}
  .kpi-card{border-radius:var(--radius-lg); padding:18px; background:var(--stamp-soft); border:1.5px solid transparent;}
  .kpi-label{font-size:13.5px; color:var(--stamp-deep); font-weight:600; margin:0 0 5px;}
  .kpi-num{font-family:var(--font-display); font-size:32px; font-weight:700; margin:0; color:var(--ink);}

  .found-box{border:1.5px solid var(--stamp); background:var(--stamp-soft); border-radius:var(--radius-md); padding:14px 18px; margin-bottom:8px; font-size:15px; line-height:1.7;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:14px 24px; border-radius:var(--radius-pill); font-size:15px; display:none; align-items:center; gap:10px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.25);}
  .toast.show{display:flex;}
  .toast.warn{background:var(--tape-deep);}

  .mock-tag{display:inline-block; font-size:12.5px; font-weight:600; color:var(--tape-deep); background:var(--tape-soft); padding:5px 12px; border-radius:var(--radius-pill); margin-bottom:14px;}

  .pie-wrap{display:flex; align-items:center; gap:28px; flex-wrap:wrap;}
  .pie-chart{width:200px; height:200px; border-radius:50%; flex-shrink:0;}
  .pie-legend{flex:1; min-width:200px;}
  .legend-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .legend-row:last-child{border-bottom:none;}
  .legend-dot{width:14px; height:14px; border-radius:50%; flex-shrink:0;}
  .legend-name{flex:1; font-size:15.5px; font-weight:500;}
  .legend-pct{font-family:var(--font-display); font-size:17px; font-weight:600;}

  .bar-chart{display:flex; align-items:flex-end; gap:14px; height:200px; padding-top:20px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end;}
  .bar-fill{width:100%; max-width:44px; background:var(--tape); border-radius:10px 10px 4px 4px; position:relative; transition:height 0.4s ease;}
  .bar-val{font-family:var(--font-display); font-size:14px; font-weight:600; color:var(--ink);}
  .bar-day{font-size:12.5px; color:var(--ink-soft);}

  .hbar-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .hbar-row:last-child{margin-bottom:0;}
  .hbar-name{width:60px; flex-shrink:0; font-size:15px; font-weight:600;}
  .hbar-track{flex:1; height:30px; background:var(--surface-kraft); border-radius:var(--radius-pill); overflow:hidden; position:relative;}
  .hbar-fill{height:100%; background:var(--tape); border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:flex-end; padding-right:12px; transition:width 0.4s ease;}
  .hbar-val{font-family:var(--font-display); font-size:14px; font-weight:700; color:var(--on-tape);}

  .seg-control{display:inline-flex; background:var(--surface-kraft); border-radius:var(--radius-pill); padding:4px; gap:4px;}
  .seg-btn{font-family:var(--font-display); font-size:14px; font-weight:600; padding:9px 18px; border-radius:var(--radius-pill); border:none; background:transparent; color:var(--ink-soft);}
  .seg-btn.active{background:var(--tape); color:var(--on-tape);}

  .report-kpi-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:12px; margin-bottom:22px;}
  .report-kpi{border-radius:var(--radius-lg); padding:20px; background:var(--surface-kraft); border:1.5px solid var(--border);}
  .report-kpi-label{font-size:13.5px; color:var(--ink-soft); font-weight:600; margin:0 0 6px; display:flex; align-items:center; gap:6px;}
  .report-kpi-num{font-family:var(--font-display); font-size:30px; font-weight:700; margin:0;}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="pi-packing-report.html"><div class="brand-tape"></div><div class="brand-icon">📦</div><p class="brand-name">JK888<br>Packing</p></a>
    <nav class="navlist">
      <a class="navitem" href="pi-packing-report.html"><span class="navicon">📊</span><span class="navlabel">Report</span></a>
      <a class="navitem" href="pi-packing.html"><span class="navicon">✏️</span><span class="navlabel">คีย์ข้อมูลรายวัน</span></a>
      <a class="navitem active" href="pi-packing-export.html"><span class="navicon">📤</span><span class="navlabel">Export</span></a>
    </nav>
  </aside>

  <main class="main">
    <p class="pagetitle">Export ข้อมูล</p>
    <p class="pagesub">เลือกเดือนหรือวันที่เพื่อดูและดาวน์โหลด ทั้งงานปัจจุบันและประวัติที่ปิดรอบแล้ว</p>

    <div class="card">
      <p class="section-label">🗓️ เลือกช่วงที่จะ Export</p>
      <div class="seg-control" style="margin-bottom:18px;">
        <button class="seg-btn active" id="segMonth">รายเดือน</button>
        <button class="seg-btn" id="segDay">รายวัน</button>
      </div>

      <div id="exportMonthField">
        <label>เลือกเดือน</label>
        <input type="month" id="exportMonthInput" style="max-width:240px;">
      </div>
      <div id="exportDayField" style="display:none;">
        <label>เลือกวันที่</label>
        <input type="date" id="exportDayInput" style="max-width:240px;">
      </div>

      <p class="hint" id="exportPreviewText" role="status" style="margin-top:14px;"></p>
      <button class="btn-main" id="exportGoBtn" style="margin-top:6px;">📤 Export เป็นไฟล์ CSV</button>
    </div>

    <div class="card" style="padding:0; overflow-x:auto;">
      <p class="section-label" style="padding:22px 22px 0;">👀 ตัวอย่างข้อมูลที่จะ Export</p>
      <table>
        <thead><tr><th>วันที่แพ็ค</th><th>คนแพ็ค</th><th>ชื่อสินค้า</th><th>จำนวน</th><th>วันที่ออเดอร์</th></tr></thead>
        <tbody id="exportPreviewBody"></tbody>
      </table>
      <div class="empty" id="exportPreviewEmpty">ไม่มีข้อมูลในช่วงที่เลือก</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="packing-storage.js?v=20261009-archive"></script>
<script src="packing-cloud.js?v=20261009-archive"></script>
<script src="packing-export.js?v=20261009-unified"></script>
<script>

var exportMode='month',exportSessions=[],exportLabel='',exportReady=false,exportFailed=false;
var requestVersion=0,archiveIndex=null,archiveCache=new Map(),sourceChoice=new Map(),cloudReady=false;
var previewText=document.getElementById('exportPreviewText'),previewBody=document.getElementById('exportPreviewBody');
var previewEmpty=document.getElementById('exportPreviewEmpty'),exportButton=document.getElementById('exportGoBtn');
function getPackingData(){return window.PackingCloud.read();}
function getFilteredRows(){return window.PackingExport.flatten(exportSessions);}
function period(){return exportMode==='month'?document.getElementById('exportMonthInput').value:document.getElementById('exportDayInput').value;}
function samePeriod(s,label,mode){return s.date && (mode==='month'?s.date.slice(0,7)===label:s.date===label);}
function clearPreview(text){
 exportSessions=[];exportReady=false;exportFailed=false;exportButton.disabled=true;exportButton.textContent='📤 Export เป็นไฟล์ CSV';
 previewBody.replaceChildren();previewText.textContent=text;previewEmpty.textContent=text;previewEmpty.style.display='block';
 var old=document.getElementById('packingDownloadLink');if(old){URL.revokeObjectURL(old.href);old.remove();}
}
async function rpc(name,args){
 var r=await window.PackingCloud.client.rpc(name,args);if(r.error)throw r.error;
 if(!Array.isArray(r.data))throw Error('ข้อมูลที่ได้รับไม่ครบ');return r.data;
}
function index(){
 if(!archiveIndex){var task=rpc('packing_archive_list');archiveIndex=task;task.catch(function(){if(archiveIndex===task)archiveIndex=null;});}
 return archiveIndex;
}
function readArchive(id){
 if(!archiveCache.has(id)){
  var cache=archiveCache,task=rpc('packing_archive_read',{p_id:id});cache.set(id,task);
  task.catch(function(){if(cache.get(id)===task)cache.delete(id);});
 }
 return archiveCache.get(id);
}
function setExportMode(mode){
 exportMode=mode;
 document.getElementById('segMonth').classList.toggle('active',mode==='month');
 document.getElementById('segDay').classList.toggle('active',mode==='day');
 document.getElementById('exportMonthField').style.display=mode==='month'?'block':'none';
 document.getElementById('exportDayField').style.display=mode==='day'?'block':'none';
 renderExportPreview();
}
async function renderExportPreview(){
 var version=++requestVersion,label=period(),mode=exportMode,month=label.slice(0,7);
 clearPreview(cloudReady?'กำลังอ่านข้อมูลช่วง '+label+'…':'กำลังรอข้อมูลจาก Supabase…');
 if(!cloudReady)return;
 if(!label){clearPreview('เลือกช่วงวันที่ก่อน');return;}
 try{
  var backups=(await index()).filter(function(b){return b.month===month;});
  if(version!==requestVersion)return;
  var active=getPackingData().filter(function(s){return samePeriod(s,label,mode);});
  var native=backups.filter(function(b){return b.id.startsWith('native:');});
  var imports=backups.filter(function(b){return b.id.startsWith('csv:');});
  var choices=[];
  if(active.length||native.length)choices.push({id:'cloud',label:'ข้อมูลบน Cloud'});
  imports.forEach(function(b){choices.push({id:b.id,label:b.label});});
  var selected=sourceChoice.get(month);
  if(!choices.some(function(c){return c.id===selected;}))selected=choices.length===1?choices[0].id:null;
  // Independent CSV copies must never be silently added to live/archived Cloud work.
  if(choices.length>1){
   previewText.textContent='เดือนนี้มีข้อมูลหลายแหล่ง เลือกชุดที่จะดูและ Export (ไม่บวกสำเนาซ้ำ): ';
   choices.forEach(function(c){
    var button=document.createElement('button');button.type='button';button.className='btn-ghost';
    button.textContent=c.label;button.setAttribute('aria-pressed',String(c.id===selected));
    button.onclick=function(){sourceChoice.set(month,c.id);renderExportPreview();};previewText.appendChild(button);
   });
  }
  if(!selected&&choices.length){previewEmpty.textContent='เลือกแหล่งข้อมูลด้านบนเพื่อแสดงรายการ';return;}
  var sessions=active,source='ข้อมูลปัจจุบัน';
  if(selected==='cloud'){
   var archived=(await Promise.all(native.map(function(b){return readArchive(b.id);}))).flat();
   // These sources are disjoint; stable IDs also guard against a stale active snapshot.
   var combined=new Map();
   active.concat(archived).forEach(function(s,i){combined.set(s._cloudId||'row:'+i,s);});
   sessions=Array.from(combined.values());source=native.length?'ข้อมูลบน Cloud รวมประวัติปิดรอบ':'ข้อมูลปัจจุบัน';
  }else if(selected){
   sessions=await readArchive(selected);source='ประวัติจากสำเนา CSV';
  }
  if(version!==requestVersion)return;
  exportSessions=sessions.filter(function(s){return samePeriod(s,label,mode);});
  exportLabel=label;exportReady=true;
  var rows=getFilteredRows(),total=rows.reduce(function(n,r){return n+r.qty;},0);
  var message=rows.length?'พบ '+rows.length.toLocaleString()+' รายการ รวม '+total.toLocaleString()+' ชิ้น · '+label+' · '+source:'ไม่พบข้อมูลในช่วง '+label;
  if(choices.length>1){previewText.appendChild(document.createTextNode(' — '+message));}
  else previewText.textContent=message;
  previewEmpty.textContent='ไม่พบข้อมูลในช่วง '+label;previewEmpty.style.display=rows.length?'none':'block';
  var fragment=document.createDocumentFragment();
  rows.forEach(function(r){var tr=document.createElement('tr');[r.date,r.packer,r.product,r.qty,r.range].forEach(function(value){var td=document.createElement('td');td.textContent=String(value);tr.appendChild(td);});fragment.appendChild(tr);});
  previewBody.replaceChildren(fragment);exportButton.disabled=!rows.length;
 }catch(e){
  if(version!==requestVersion)return;
  clearPreview('โหลดข้อมูลไม่สำเร็จ: '+(e.code==='PGRST202'?'ยังไม่มีระบบประวัติปิดรอบในฐานข้อมูล':e.message));
  exportFailed=true;exportButton.disabled=false;exportButton.textContent='ลองโหลดข้อมูลอีกครั้ง';
 }
}
document.getElementById('segMonth').onclick=function(){setExportMode('month');};
document.getElementById('segDay').onclick=function(){setExportMode('day');};
document.getElementById('exportMonthInput').addEventListener('change',renderExportPreview);
document.getElementById('exportDayInput').addEventListener('change',renderExportPreview);
var parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
function datePart(type){return parts.find(function(p){return p.type===type;}).value;}
var today=datePart('year')+'-'+datePart('month')+'-'+datePart('day');
document.getElementById('exportMonthInput').value=today.slice(0,7);
document.getElementById('exportDayInput').value=today;
exportButton.onclick=function(){
 if(exportFailed){renderExportPreview();return;}
 if(!exportReady||exportButton.disabled||exportLabel!==period())return;
 window.PackingExport.download(exportSessions,'งานแพ็ค_'+exportLabel+'.csv');
};
window.addEventListener('packingcloudready',function(){
 cloudReady=true;archiveIndex=null;archiveCache=new Map();renderExportPreview();
});
renderExportPreview();
</script>

</body>
</html>
