<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>ตั้งรหัสผ่านใหม่ — JK888 Packing</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#241c13;color:#f6ebdb;font:16px/1.65 system-ui,sans-serif}
    main{width:100%;max-width:460px;border:1px solid #68523b;border-radius:22px;padding:30px;background:#332619;box-shadow:0 16px 60px #0003}
    .brand{color:#ffac8f;font-size:14px;letter-spacing:.04em}h1{font-size:26px;line-height:1.4;margin:12px 0}p{color:#d3bda1;margin:12px 0}label{display:block;margin:20px 0 6px}
    input,button{font:inherit;width:100%;border-radius:10px;padding:12px}input{border:1px solid #82664a;background:#241c13;color:#fff7e9}button{margin-top:20px;background:#ff8967;color:#29170f;border:0;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}a{color:#ffb49c}footer{margin-top:24px;font-size:14px}.hint{font-size:13px}#message{padding:12px;border-radius:10px;background:#443421;overflow-wrap:anywhere}#message[data-error="true"]{background:#5b3030;color:#ffe1df}#message:empty{display:none}[hidden]{display:none!important}
    :focus-visible{outline:3px solid #ffd6a1;outline-offset:3px}
  </style>
</head>
<body>
<main>
  <div class="brand">📦 JK888 PACKING</div>
  <h1 id="heading">ลืมรหัสผ่าน</h1>
  <p id="intro">ใช้อีเมลเดิมที่ลงทะเบียน เพื่อรับลิงก์ตั้งรหัสผ่านใหม่</p>
  <p id="message" role="status" aria-live="polite">กำลังเตรียมระบบ…</p>
  <form id="requestForm" hidden>
    <label for="email">อีเมลที่ใช้เข้า Packing</label>
    <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
    <button id="requestButton" type="submit">ส่งลิงก์ตั้งรหัสใหม่</button>
    <p class="hint">ข้อมูลและสิทธิ์ยังเป็นของบัญชีเดิม ไม่ต้องสมัครใหม่</p>
  </form>
  <form id="passwordForm" hidden>
    <p id="account" class="hint"></p>
    <label for="password">รหัสผ่านใหม่</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="passwordHint">
    <p id="passwordHint" class="hint">อย่างน้อย 12 ตัวอักษร แนะนำให้มีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก ตัวเลข และสัญลักษณ์</p>
    <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
    <button id="saveButton" type="submit">บันทึกรหัสผ่านใหม่</button>
  </form>
  <noscript><p>กรุณาเปิด JavaScript ในเบราว์เซอร์เพื่อรีเซ็ตรหัสผ่าน</p></noscript>
  <footer><a href="pi-packing.html">กลับไปเข้าสู่ระบบ Packing</a></footer>
</main>
<!-- This page intentionally does NOT load packing-cloud.js or any business-data scripts. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="packing-reset-password.js?v=20260926-password-reset"></script>
</body>
</html>
